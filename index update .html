<script>
const $=s=>document.querySelector(s);
const S=Array(6).fill(null);let cur=0,anim=null,sel=null,playing=false,pcMode=false,pcSel=[];
const msg=t=>{const e=$('#toast');e.textContent=t;e.style.display=t?'block':'none';clearTimeout(msg.t);msg.t=setTimeout(()=>e.style.display='none',4500)};
const walk=(o,cb)=>{if(Array.isArray(o))o.forEach(x=>walk(x,cb));else if(o&&typeof o==='object'){cb(o);for(const k in o)walk(o[k],cb)}};
const hex=a=>'#'+a.slice(0,3).map(v=>Math.round(Math.min(1,Math.max(0,v))*255).toString(16).padStart(2,'0')).join('');
const unhex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);

/* ---------- SVG -> Lottie (gradients kept) ---------- */
const cx2=document.createElement('canvas').getContext('2d',{willReadFrequently:true});
const rgb=c=>{cx2.clearRect(0,0,1,1);cx2.fillStyle='#000';cx2.fillStyle=c;cx2.fillRect(0,0,1,1);const d=cx2.getImageData(0,0,1,1).data;return[d[0]/255,d[1]/255,d[2]/255]};
const A=(e,k,d=0)=>parseFloat(e.getAttribute(k))||d;
function toD(e){const n=e.localName;
 if(n==='path')return e.getAttribute('d')||'';
 if(n==='rect'){const x=A(e,'x'),y=A(e,'y'),w=A(e,'width'),h=A(e,'height');return`M${x} ${y}H${x+w}V${y+h}H${x}Z`}
 if(n==='circle'||n==='ellipse'){const cx=A(e,'cx'),cy=A(e,'cy'),rx=n==='circle'?A(e,'r'):A(e,'rx'),ry=n==='circle'?rx:A(e,'ry'),k=.5523;
  return`M${cx+rx} ${cy}C${cx+rx} ${cy+ry*k} ${cx+rx*k} ${cy+ry} ${cx} ${cy+ry}C${cx-rx*k} ${cy+ry} ${cx-rx} ${cy+ry*k} ${cx-rx} ${cy}C${cx-rx} ${cy-ry*k} ${cx-rx*k} ${cy-ry} ${cx} ${cy-ry}C${cx+rx*k} ${cy-ry} ${cx+rx} ${cy-ry*k} ${cx+rx} ${cy}Z`}
 if(n==='line')return`M${A(e,'x1')} ${A(e,'y1')}L${A(e,'x2')} ${A(e,'y2')}`;
 const p=(e.getAttribute('points')||'').trim();return p?'M'+p+(n==='polygon'?'Z':''):''}
function parsePath(d,f){
 const t=d.match(/[a-zA-Z]|[-+]?(?:\d*\.\d+|\d+\.?)(?:e[-+]?\d+)?/gi)||[];
 let i=0,c='',x=0,y=0,sx=0,sy=0,pc=null,pq=null,prev='',cu=null;const subs=[],bb=[1e9,1e9,-1e9,-1e9];
 const n=()=>parseFloat(t[i++]),bx=(a,b)=>{bb[0]=Math.min(bb[0],a);bb[1]=Math.min(bb[1],b);bb[2]=Math.max(bb[2],a);bb[3]=Math.max(bb[3],b)};
 const add=(a,b)=>{bx(a,b);cu.v.push(f(a,b));cu.i.push([0,0]);cu.o.push([0,0])};
 const ens=()=>{if(!cu){cu={v:[],i:[],o:[],c:false};subs.push(cu);add(x,y)}};
 const cv=(a,b,e,g,px,py)=>{ens();bx(a,b);bx(e,g);const l=cu.v.length-1,P1=f(a,b),P2=f(e,g);add(px,py);const V=cu.v[l],W=cu.v[l+1];cu.o[l]=[P1[0]-V[0],P1[1]-V[1]];cu.i[l+1]=[P2[0]-W[0],P2[1]-W[1]];pc=[e,g];x=px;y=py};
 while(i<t.length){
  if(/^[a-z]$/i.test(t[i]))c=t[i++];else if(c==='M')c='L';else if(c==='m')c='l';
  const rel=c>='a',C=c.toUpperCase(),ox=rel?x:0,oy=rel?y:0;
  if(C==='Z'){if(cu)cu.c=true;cu=null;x=sx;y=sy;prev='Z';if(i<t.length&&!/^[a-z]$/i.test(t[i]))break;continue}
  if(C==='M'){x=n()+ox;y=n()+oy;sx=x;sy=y;cu=null;ens()}
  else if(C==='L'){ens();x=n()+ox;y=n()+oy;add(x,y)}
  else if(C==='H'){ens();x=n()+ox;add(x,y)}
  else if(C==='V'){ens();y=n()+oy;add(x,y)}
  else if(C==='C'){const a=n()+ox,b=n()+oy,e=n()+ox,g=n()+oy,px=n()+ox,py=n()+oy;cv(a,b,e,g,px,py)}
  else if(C==='S'){const e=n()+ox,g=n()+oy,px=n()+ox,py=n()+oy,r=(prev==='C'||prev==='S')&&pc;cv(r?2*x-pc[0]:x,r?2*y-pc[1]:y,e,g,px,py)}
  else if(C==='Q'||C==='T'){let q;if(C==='Q')q=[n()+ox,n()+oy];const px=n()+ox,py=n()+oy;if(C==='T')q=(prev==='Q'||prev==='T')&&pq?[2*x-pq[0],2*y-pq[1]]:[x,y];
   pq=q;cv(x+2/3*(q[0]-x),y+2/3*(q[1]-y),px+2/3*(q[0]-px),py+2/3*(q[1]-py),px,py)}
  else if(C==='A'){i+=5;ens();x=n()+ox;y=n()+oy;add(x,y)}
  else break;
  prev=C}
 return{subs,bb}}
function svgToShapes(txt){
 const doc=new DOMParser().parseFromString(txt,'image/svg+xml'),svg=doc.documentElement;
 if(doc.querySelector('parsererror'))throw'SVG نامعتبر';
 let vb=(svg.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number);
 if(vb.length<4||vb.some(isNaN))vb=[0,0,A(svg,'width',512),A(svg,'height',512)];
 const sc=400/Math.max(vb[2],vb[3]),cx=vb[0]+vb[2]/2,cy=vb[1]+vb[3]/2,P=(x,y)=>[(x-cx)*sc,(y-cy)*sc];
 const byId=id=>doc.querySelector('[id="'+id+'"]');
 const prop=(e,k)=>{for(;e&&e.nodeType===1;e=e.parentNode){const m=(e.getAttribute('style')||'').match(new RegExp('(?:^|;)\\s*'+k+'\\s*:\\s*([^;]+)'));const v=m?m[1].trim():e.getAttribute(k);if(v!=null&&v!=='')return v}return null};
 const mul=(p,q)=>[p[0]*q[0]+p[2]*q[1],p[1]*q[0]+p[3]*q[1],p[0]*q[2]+p[2]*q[3],p[1]*q[2]+p[3]*q[3],p[0]*q[4]+p[2]*q[5]+p[4],p[1]*q[4]+p[3]*q[5]+p[5]];
 const mat=e=>{const ch=[];for(;e&&e.nodeType===1;e=e.parentNode)ch.unshift(e);let M=[1,0,0,1,0,0];
  ch.forEach(el=>{for(const m of(el.getAttribute('transform')||'').matchAll(/(\w+)\s*\(([^)]*)\)/g)){const a=m[2].split(/[\s,]+/).filter(Boolean).map(Number);let q=[1,0,0,1,0,0];
   if(m[1]==='translate')q=[1,0,0,1,a[0],a[1]||0];else if(m[1]==='scale')q=[a[0],0,0,a[1]??a[0],0,0];else if(m[1]==='matrix')q=a;
   else if(m[1]==='rotate'){const r=a[0]*Math.PI/180,c=Math.cos(r),s=Math.sin(r);q=[c,s,-s,c,0,0];if(a.length>2)q=mul(mul([1,0,0,1,a[1],a[2]],q),[1,0,0,1,-a[1],-a[2]])}
   M=mul(M,q)}});return M};
 const ga=(g,n)=>{const v=g.getAttribute(n);if(v!=null)return v;const h=g.getAttribute('href')||g.getAttribute('xlink:href');const r=h&&byId(h.slice(1));return r?ga(r,n):null};
 const stops=g=>{const s=[...g.querySelectorAll('stop')];if(s.length)return s;const h=g.getAttribute('href')||g.getAttribute('xlink:href');const r=h&&byId(h.slice(1));return r?stops(r):[]};
 const num=(v,d)=>{if(v==null)return d;const p=v.includes('%');v=parseFloat(v);return p?v/100:v};
 const K=v=>({a:0,k:v});
 const paint=(v,bb,f,o,stroke,w,e)=>{
  const m=/url\(['"]?#([^'")]+)/.exec(v),g=m&&byId(m[1]);
  const base=stroke?{ty:'st',w:K(w),lc:{butt:1,round:2,square:3}[prop(e,'stroke-linecap')]||1,lj:{miter:1,round:2,bevel:3}[prop(e,'stroke-linejoin')]||1,ml:4}:{ty:'fl',r:prop(e,'fill-rule')==='evenodd'?2:1};
  if(!g)return{...base,c:K([...rgb(v),1]),o:K(o*100)};
  const rad=g.localName==='radialGradient',us=ga(g,'gradientUnits')==='userSpaceOnUse';
  const mp=(a,b)=>us?f(a,b):f(bb[0]+a*(bb[2]-bb[0]),bb[1]+b*(bb[3]-bb[1]));
  const q=(n,d)=>num(ga(g,n),d);
  let s,en;if(rad){const gx=q('cx',.5),gy=q('cy',.5);s=mp(gx,gy);en=mp(gx+q('r',.5),gy)}else{s=mp(q('x1',0),q('y1',0));en=mp(q('x2',1),q('y2',0))}
  const st=stops(g),k=[],al=[];
  st.forEach(x=>{const off=Math.min(1,Math.max(0,num(x.getAttribute('offset'),0))),op=parseFloat(prop(x,'stop-opacity')??1);
   k.push(off,...rgb(prop(x,'stop-color')||'#000'));al.push(off,op*o)});
  const needA=al.some((v,i)=>i%2&&v<1);
  return{...base,ty:stroke?'gs':'gf',t:rad?2:1,s:K(s),e:K(en),g:{p:st.length,k:K(needA?k.concat(al):k)},o:K(100)}};
 const groups=[];
 svg.querySelectorAll('path,rect,circle,ellipse,polygon,polyline,line').forEach(e=>{
  if(e.closest('defs,clipPath,mask,symbol,pattern,marker'))return;
  const M=mat(e),f=(x,y)=>P(M[0]*x+M[2]*y+M[4],M[1]*x+M[3]*y+M[5]);
  const{subs,bb}=parsePath(toD(e),f);if(!subs.length)return;
  let op=1;for(let p=e;p&&p.nodeType===1;p=p.parentNode){const v=parseFloat(p.getAttribute('opacity'));if(!isNaN(v))op*=v}
  const it=subs.map(s=>({ty:'sh',ks:K({i:s.i,o:s.o,v:s.v,c:s.c})}));
  const sk=prop(e,'stroke'),fl=prop(e,'fill')??'#000';
  if(sk&&sk!=='none')it.push(paint(sk,bb,f,op*parseFloat(prop(e,'stroke-opacity')??1),true,(parseFloat(prop(e,'stroke-width'))||1)*sc*Math.hypot(M[0],M[1]),e));
  if(fl!=='none')it.push(paint(fl,bb,f,op*parseFloat(prop(e,'fill-opacity')??1),false,0,e));
  it.push({ty:'tr',p:K([0,0]),a:K([0,0]),s:K([100,100]),r:K(0),o:K(100),sk:K(0),sa:K(0)});
  groups.push({ty:'gr',it,nm:e.id||e.localName})});
 if(!groups.length)throw'شکلی در SVG پیدا نشد';
 return groups.reverse()}
const K1=v=>({a:0,k:v});
const shapeLayer=(shapes,nm)=>({ddd:0,ind:1,ty:4,nm,sr:1,ks:{o:K1(100),r:K1(0),p:K1([256,256,0]),a:K1([0,0,0]),s:K1([100,100,100])},ao:0,shapes,ip:0,op:180,st:0,bm:0});
const newLottie=(sh,nm)=>({v:'5.5.2',fr:60,ip:0,op:180,w:512,h:512,nm,ddd:0,assets:[],layers:[shapeLayer(sh,nm)]});

/* ---------- player ---------- */
function ph(){if(!anim)return;const p=Math.min(1,anim.currentFrame/anim.totalFrames);$('#ph').style.left=`calc(var(--lw) + (100% - var(--lw))*${p})`;$('#fr').textContent=Math.round(anim.currentFrame)+' / '+Math.round(anim.totalFrames);$('#sk').value=p*1000}
const layerAt=(d,path)=>{let arr=d.layers,l;for(const i of path){l=arr&&arr[i];arr=(l&&l.refId&&((d.assets||[]).find(a=>a.id===l.refId)||{}).layers)||null}return l};
const hitPath=(els,t)=>{for(let i=0;i<els.length;i++){const e=els[i];if(e&&e.baseElement&&e.baseElement.contains(t)){const p=e.elements&&hitPath(e.elements,t);return p?[i,...p]:[i]}}return null};
function hi(){if(!anim)return;const svg=anim.renderer.svgElement;if(!svg)return;const old=svg.querySelector('#selbox');if(old)old.remove();
 if(!sel)return;let els=anim.renderer.elements,e;for(const i of sel){e=els&&els[i];els=e&&e.elements}
 if(!e||!e.baseElement)return;
 try{const g=e.baseElement,b=g.getBBox();if(!(b.width>0||b.height>0))return;
  const M=svg.getScreenCTM().inverse().multiply(g.getScreenCTM()),pt=svg.createSVGPoint();
  const pts=[[b.x,b.y],[b.x+b.width,b.y],[b.x+b.width,b.y+b.height],[b.x,b.y+b.height]].map(([x,y])=>{pt.x=x;pt.y=y;const q=pt.matrixTransform(M);return q.x+','+q.y}).join(' ');
  const NS='http://www.w3.org/2000/svg',G=document.createElementNS(NS,'g');G.id='selbox';G.style.pointerEvents='none';
  [['#fff',4,''],['#00d8ff',2,'6 4']].forEach(([c,w,da])=>{const p=document.createElementNS(NS,'polygon');p.setAttribute('points',pts);p.setAttribute('fill','none');p.setAttribute('stroke',c);p.setAttribute('stroke-width',w);p.setAttribute('vector-effect','non-scaling-stroke');if(da)p.setAttribute('stroke-dasharray',da);G.append(p)});
  svg.append(G)}catch(_){}}
$('#pv').onclick=e=>{if(!anim)return;const p=hitPath(anim.renderer.elements,e.target);
 if(pcMode){const n=pcSel.length?pcSel[0].length:1;if(p&&p.length>=n)togglePc(p.slice(0,n));return}
 sel=p;panels()};
function snap(){const s=S[cur];s.h.push(JSON.stringify(s.data));if(s.h.length>40)s.h.shift();s.r=[]}
function hist(a,b){const s=S[cur];if(!s||!s[a].length)return msg('چیزی برای برگشت نیست');s[b].push(JSON.stringify(s.data));s.data=JSON.parse(s[a].pop());show(true)}
$('#un').onclick=()=>hist('h','r');$('#re').onclick=()=>hist('r','h');
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?hist('r','h'):hist('h','r')}});
function X(dx,dy,k){const s=S[cur],d=s&&s.data,l=sel&&layerAt(d,sel);if(!l)return msg('اول روی لایه کلیک کن');
 if(l.ty===4){let w=l.shapes[0];
